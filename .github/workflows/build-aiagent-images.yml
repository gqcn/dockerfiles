name: Build aiagent images

on:
  push:
    branches:
      - master
      - main
    paths:
      - "aiagent/base/**"
      - "aiagent/all/**"
      - ".github/workflows/build-aiagent-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: loads/aiagent
            tag: base-26.04
            dockerfile: aiagent/base/Dockerfile
            context: aiagent/base
          - name: loads/aiagent
            tag: all-26.04
            dockerfile: aiagent/all/Dockerfile
            context: aiagent/all

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image.name }}:${{ matrix.image.tag }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image.name }}:${{ matrix.image.tag }}
